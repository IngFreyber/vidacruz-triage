# alertas-service: 2 réplicas. Un tablero conectado por SSE a una réplica recibe las alertas que procesa la otra
# gracias a la difusión por Redis Pub/Sub (ADR-0007).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertas
  namespace: vidacruz
  labels: { app: alertas, app.kubernetes.io/part-of: vidacruz }
spec:
  replicas: 2
  selector:
    matchLabels: { app: alertas }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: alertas }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Sin "service links": Kubernetes inyectaría REDIS_PORT=tcp://10.0.x.x:6379 (por el Service 'redis'), que choca
      # con la variable REDIS_PORT que espera la aplicación. Los servicios se descubren por DNS.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: esperar-dependencias
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379 && nc -z kafka 9092; do echo esperando redis/kafka; sleep 3; done"]
          securityContext: { runAsUser: 65534, allowPrivilegeEscalation: false }
      containers:
        - name: alertas
          image: vidacruz/alertas-service:local
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef: { name: vidacruz-config }
          env:
            - name: ALERTAS_API_KEY
              valueFrom: { secretKeyRef: { name: vidacruz-secretos, key: ALERTAS_API_KEY } }
            - name: TEAMS_WEBHOOK_URL
              valueFrom: { secretKeyRef: { name: vidacruz-secretos, key: TEAMS_WEBHOOK_URL, optional: true } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertas
  namespace: vidacruz
  labels: { app: alertas }
spec:
  selector: { app: alertas }
  ports:
    - name: http
      port: 80
      targetPort: http
