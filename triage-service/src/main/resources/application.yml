spring:
  reactor:
    # Propaga traza y MDC a través de los operadores de Reactor (logs con traceId en código reactivo).
    context-propagation: auto
  application:
    name: triage-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage}
    username: ${DB_USER:triage}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    # Flyway usa JDBC solo durante el arranque (no en el event loop).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage}
    user: ${DB_USER:triage}
    password: ${DB_PASSWORD}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
      # Un decimal en un campo entero (p. ej. edad 30.7) es un error, no se trunca en silencio.
      accept-float-as-int: false
  webflux:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never

triage:
  # RN-02: SLA por nivel (formato Duration: 5m, 30s, 2h). Se sobreescriben por variables de entorno,
  # p. ej. SLA_CRITICO=30s, para probar el escalamiento sin esperar.
  sla:
    critico: ${SLA_CRITICO:5m}
    urgente: ${SLA_URGENTE:10m}
    urgente-2: ${SLA_URGENTE_2:30m}
    no-urgente: ${SLA_NO_URGENTE:60m}
    no-urgente-2: ${SLA_NO_URGENTE_2:120m}
  # RF-03: monitor de SLA. Con SLA_CRITICO=30s y TRIAGE_ESCALAMIENTO_INTERVALO=5s se observa el
  # escalamiento de un paciente CRITICO en menos de un minuto.
  escalamiento:
    habilitado: ${TRIAGE_ESCALAMIENTO_HABILITADO:true}
    intervalo: ${TRIAGE_ESCALAMIENTO_INTERVALO:30s}
    tamano-lote: ${TRIAGE_ESCALAMIENTO_TAMANO_LOTE:200}
  reportes:
    # RF-05: rango máximo de un reporte (acota el tamaño de la respuesta: 31 días = 744 filas horarias).
    rango-maximo: ${TRIAGE_REPORTES_RANGO_MAXIMO:31d}
  eventos:
    topic: ${KAFKA_TOPIC_EVENTOS:triaje.eventos}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    outbox:
      habilitado: ${OUTBOX_HABILITADO:true}
      intervalo: ${OUTBOX_INTERVALO:500ms}
      tamano-lote: ${OUTBOX_TAMANO_LOTE:100}
  quejas-administrativas:
    - documentos
    - recolección de resultados
    - renovación de recetario
    - vacunación
    - seguimiento

# Autenticación por API key (ADR-0008). Sin valor por defecto: el servicio no arranca sin TRIAGE_API_KEY.
seguridad:
  api-keys: ${TRIAGE_API_KEY}
  header: X-API-Key

logging:
  # Logs estructurados ECS (JSON) con traceId/spanId. LOG_FORMATO vacío = formato legible para desarrollo.
  structured:
    format:
      console: ${LOG_FORMATO:ecs}
  level:
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # liveness: solo el estado interno (una dependencia caída no debe reiniciar el pod).
        liveness:
          include: livenessState
        # readiness: el pod recibe tráfico solo si sus dependencias imprescindibles responden.
        readiness:
          include: readinessState,r2dbc
  tracing:
    sampling:
      probability: ${TRACING_MUESTREO:1.0}
  # El exportador OTLP se activa definiendo MANAGEMENT_OTLP_TRACING_ENDPOINT (p. ej. http://jaeger:4318/v1/traces).
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
